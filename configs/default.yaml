# Default Medical CV training config
experiment:
  name: medical_cv_baseline
  seed: 42
  output_dir: outputs

data:
  name: generic_medical  # generic_medical | face_medical
  root: data/raw
  image_size: 256
  in_channels: 1
  num_classes: 2
  batch_size: 8
  num_workers: 4
  train_ratio: 0.8
  val_ratio: 0.1
  # set true for 3D NIfTI volumes with MONAI transforms
  is_3d: false

model:
  name: unet  # unet | resnet | vit
  encoder_name: resnet34  # for resnet / optional unet backbone
  pretrained: true
  dropout: 0.1

train:
  max_epochs: 100
  lr: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: adamw  # adam | adamw | sgd
  scheduler: cosine  # none | cosine | step
  loss: dice_ce  # ce | dice | dice_ce
  amp: true
  gradient_clip_val: 1.0
  early_stopping_patience: 20
  log_every_n_steps: 10
  save_top_k: 3
  monitor: val/dice
  monitor_mode: max

eval:
  checkpoint: null  # path to .ckpt / .pth
  save_predictions: true
  metrics:
    - dice
    - iou
    - hd95
    - sensitivity
    - specificity
